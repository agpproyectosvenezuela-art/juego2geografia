<header><div class="brand"><div class="logo" aria-hidden="true">✦</div><div>GEOAVENTURA<small>LAS ISLAS DE LA BRÚJULA</small></div></div><div class="top-actions"><span class="stat-pill" id="gemStat">◆ 0 cristales</span><button class="icon-button" id="audioBtn" aria-label="Activar o silenciar sonido" title="Sonido">♫</button><button class="icon-button" id="guideBtn" aria-label="Abrir cuaderno de exploración" title="Cuaderno">▤</button><button class="icon-button" id="settingsBtn" aria-label="Abrir ajustes" title="Ajustes">⚙</button></div></header>
<main class="shell" id="app"></main><div id="modal" class="hidden"></div><div id="announcer" class="sr-only" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY='geoaventura-v1';
const WORLD=[{name:'Bosque Brújula',short:'Cardinales',icon:'🧭',color:'#edf3de',text:'Encuentra el norte y guía a Luma por el bosque.',lesson:'Los puntos cardinales son norte, sur, este y oeste. En nuestras cuadrículas, el norte está arriba. La rosa de los vientos indica la orientación.'},{name:'Villa Garabato',short:'Croquis',icon:'✏️',color:'#fff0de',text:'Sigue referencias y descubre dibujos hechos a mano.',lesson:'Un croquis es un dibujo sencillo a mano alzada. Sirve para ubicar lugares y mostrar rutas. No necesita medidas exactas ni una escala precisa.'},{name:'Archipiélago Atlas',short:'Mapas',icon:'🗺️',color:'#e5f2f8',text:'Explora territorios, colores y símbolos de mapas.',lesson:'Un mapa representa un territorio en una superficie plana. Puede mostrar ciudades, regiones o países. Su leyenda explica los símbolos y colores; su escala relaciona distancias.'},{name:'Ciudad Regla',short:'Planos',icon:'📐',color:'#ece8fa',text:'Lee habitaciones, medidas y lugares vistos desde arriba.',lesson:'Un plano representa con detalle un espacio, como una casa o un aula. Usa medidas, escala y símbolos. Nos ayuda a conocer su distribución.'},{name:'Cumbre Cristal',short:'Gran reto',icon:'💎',color:'#fff1d6',text:'Combina lo aprendido y recupera la gran brújula.',lesson:'Elige según tu misión: croquis para una ruta sencilla, mapa para un territorio y plano para la distribución detallada de un lugar. Los puntos cardinales ayudan a orientarlos.'}];
const DIRS=[{id:'N',name:'Norte',dx:0,dy:-1,arrow:'↑'},{id:'E',name:'Este',dx:1,dy:0,arrow:'→'},{id:'S',name:'Sur',dx:0,dy:1,arrow:'↓'},{id:'O',name:'Oeste',dx:-1,dy:0,arrow:'←'}];
const CONCEPTS=[{id:'croquis',name:'Croquis',icon:'✏️',desc:'Dibujo a mano alzada, sin medidas exactas.'},{id:'mapa',name:'Mapa',icon:'🗺️',desc:'Representación plana de un territorio.'},{id:'plano',name:'Plano',icon:'📐',desc:'Distribución detallada, con medidas y escala.'},{id:'cardinal',name:'Puntos cardinales',icon:'🧭',desc:'Norte, sur, este y oeste para orientarnos.'}];
let save={stars:{},sound:true,music:true,voice:false,teacher:false};let storageOK=true;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.stars&&typeof raw.stars==='object')save={...save,...raw,stars:Object.fromEntries(Object.entries(raw.stars).filter(([n,v])=>+n>=1&&+n<=200&&[1,2,3].includes(v)))};}catch(e){storageOK=false;}
let selectedWorld=Math.min(4,Math.floor((nextLevel()-1)/40));let current=null;let screen='home';let roundToken=0;let narrationTimer=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){storageOK=false;}}
function completed(){return Object.keys(save.stars).length;}
function nextLevel(){for(let i=1;i<=200;i++)if(!save.stars[i])return i;return 200;}
function unlocked(n){return save.teacher||n===1||!!save.stars[n-1]||!!save.stars[n];}
function totalStars(){return Object.values(save.stars).reduce((a,b)=>a+b,0);}
function updateHeader(){$('#gemStat').textContent='◆ '+totalStars()*10+' cristales';$('#audioBtn').textContent=save.sound?'♫':'♪';$('#audioBtn').setAttribute('aria-pressed',String(save.sound));$('#audioBtn').title=save.sound?'Silenciar sonido':'Activar sonido';}
function rng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(items,r){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let audioCtx=null;let musicTimer=null;let musicStep=0;let lastTick=0;
function ensureAudio(){if(!save.sound)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});if(save.music&&!musicTimer)musicTimer=setInterval(musicTick,350);}catch(e){}}
function tone(freq,duration=.14,type='sine',volume=.07,delay=0){if(!save.sound||!audioCtx||audioCtx.state!=='running')return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.start(t);o.stop(t+duration+.03);}catch(e){}}
function sfx(kind){ensureAudio();if(kind==='ok'){[523,659,784].forEach((f,i)=>tone(f,.22,'sine',.09,i*.075));}else if(kind==='win'){[523,659,784,1047,988,1047].forEach((f,i)=>tone(f,.35,'triangle',.1,i*.12));}else if(kind==='error'){tone(196,.16,'triangle',.05);tone(165,.2,'triangle',.04,.12);}else if(kind==='step'){tone(440,.06,'sine',.045);}else tone(620,.06,'sine',.04);}
function musicTick(){if(!save.sound||!save.music||document.hidden||!audioCtx||audioCtx.state!=='running')return;const notes=[262,0,330,392,0,330,294,0,262,330,440,0,392,330,294,0];const f=notes[musicStep++%notes.length];if(f)tone(f,.4,'sine',.018);if(musicStep%4===0)tone(131,.6,'triangle',.015);}
function stopMusic(){clearInterval(musicTimer);musicTimer=null;}
function speak(text){clearTimeout(narrationTimer);if(!save.voice||!save.sound||!window.speechSynthesis)return;window.speechSynthesis.cancel();narrationTimer=setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.88;u.pitch=1.06;window.speechSynthesis.speak(u);},200);}
function announce(text){$('#announcer').textContent=text;}
function toast(text){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;t.setAttribute('role','status');document.body.append(t);setTimeout(()=>t.remove(),4200);}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<45;i++){const el=document.createElement('div');el.className='confetti';el.style.cssText=`left:${Math.random()*100}%;top:-20px;width:${6+Math.random()*7}px;height:${9+Math.random()*9}px;background:${['#f78057','#ffdc76','#087f73','#8171d7'][i%4]};animation-delay:${Math.random()*.6}s;animation-duration:${1.5+Math.random()}s;`;document.body.append(el);setTimeout(()=>el.remove(),3300);}}

 class="map-bottom"><span>★ Guarda estrellas · ◆ Reúne cristales</span><span>○ Cada 10 niveles: reto especial</span></div></div><p class="footer-note">Sin reloj ni vidas que se agoten. Puedes intentarlo de nuevo y aprender a tu ritmo.<br>Basado en «¿Cómo podemos representar el mundo?» · Geografía para básica primaria.</p></section><aside class="home-aside"><div class="side-card"><div class="mascot-round">${mascot()}</div><div class="kicker">Tu compañera de viaje</div><h3>¡Hola! Soy Luma.</h3><p class="muted">No necesitas saberlo todo. Mira las pistas, prueba y descubre. Yo te acompaño.</p><div class="progress-bar"><span style="width:${completed()/2}%"></span></div><div class="progress-label"><span>${completed()} de 200 niveles</span><span>${Math.round(completed()/2)}%</span></div><p class="muted" style="font-size:11px;margin-top:13px">${storageOK?'Tu avance se guarda en este navegador.':'Este navegador no permite guardar. El avance se conserva mientras mantengas abierto el juego.'}</p></div><div class="side-card"><div class="kicker">Cuaderno de campo</div><h3>Cuatro descubrimientos</h3>${CONCEPTS.map(c=>`<div class="concept-row"><div class="badge" aria-hidden="true">${c.icon}</div><div><b>${c.name}</b><p>${c.desc}</p></div></div>`).join('')}<button class="secondary" id="learnBtn" style="width:100%;margin-top:15px;font-size:12px">Abrir el cuaderno →</button></div><div class="side-card achievement-card"><div class="kicker">Tus insignias</div>${WORLD.map((x,i)=>{const earned=Array.from({length:40},(_,j)=>save.stars[i*40+j+1]).every(Boolean);return `<div class="achievement ${earned?'earned':''}"><span class="seal">${x.icon}</span><span><b>${x.short}</b><br><span class="muted" style="font-size:10px">${earned?'Isla completada':'Completa sus 40 niveles'}</span></span></div>`;}).join('')}</div></aside></div>`;$('#continueBtn').onclick=()=>startLevel(nextLevel());document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{selectedWorld=+b.dataset.world;sfx('tap');home();});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.level));$('#learnBtn').onclick=guide;}

function directionTask(r,tier){const d=DIRS[Math.floor(r()*4)];if(tier>1&&r()<.35){const rotation=[90,180,270][Math.floor(r()*3)];return mc('La brújula giratoria','La rosa de los vientos está girada. ¿Qué letra falta?',DIRS.map(x=>({text:x.id+' · '+x.name,id:x.id})),d.id,`Falta ${d.id}, de ${d.name}. Aunque gire el dibujo, las direcciones conservan sus posiciones relativas.`,compassSvg(d.id,rotation),'Busca su dirección opuesta: N está frente a S; E está frente a O.');}return mc('¡Encuentra el cristal!','¿En qué dirección está el cristal con respecto a Luma?',DIRS.map(x=>({text:x.arrow+' '+x.name,id:x.id})),d.id,`El cristal está al ${d.name.toLowerCase()} de Luma. En esta cuadrícula, el norte está arriba.`,locationSvg(d.dx,d.dy),'Busca la posición del cristal y compara con las letras de orientación.');}

function sunTask(r){const rising=r()<.5;return mc('Una pista en el cielo',`De manera general, ¿por qué dirección ${rising?'sale':'se oculta'} el Sol?`,DIRS.map(x=>({text:x.name,id:x.id})),rising?'E':'O',`De manera general, el Sol sale por el este y se oculta por el oeste.`,compassSvg(null),'Recuerda: el amanecer se relaciona con el este; el atardecer, con el oeste.');}

function renderRoute(t){current.route={x:t.start.x,y:t.start.y,step:0,moves:0,visited:[{...t.start}]};const area=$('#taskArea');area.innerHTML=`${t.type==='route'?`<div class="route-sequence" id="sequence"></div>`:'<p class="muted" style="font-size:12px;text-align:center;margin-bottom:10px">Referencias: 🦊 Luma · 🏫 Escuela · 🪨 Roca<br>El camino amarillo es un croquis: no muestra medidas exactas.</p>'}<div class="route-frame"><span class="cardinal-label north">N ↑</span><span class="cardinal-label east">E →</span><span class="cardinal-label south">S ↓</span><span class="cardinal-label west">O ←</span><div class="route-board" id="routeBoard" style="grid-template-columns:repeat(${t.size},1fr)"></div></div><div class="route-status" id="routeStatus"></div><div class="dpad" aria-label="Controles de dirección"><button data-move="N" aria-label="Mover al norte">↑ N</button><button data-move="O" aria-label="Mover al oeste">← O</button><button data-move="E" aria-label="Mover al este">E →</button><button data-move="S" aria-label="Mover al sur">↓ S</button></div><div style="text-align:center;margin-top:9px"><button class="hint-button" id="routeReset">↺ Volver al inicio</button></div>`;paintRoute(t);document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));$('#routeReset').onclick=()=>{if(current.resolved)return;current.route={x:t.start.x,y:t.start.y,step:0,moves:0,visited:[{...t.start}]};paintRoute(t);feedback('Volviste al inicio. ¡Prueba otra vez!','hint');};}
function paintRoute(t){const p=current.route;$('#routeBoard').innerHTML=Array.from({length:t.size*t.size},(_,i)=>{const x=i%t.size,y=Math.floor(i/t.size),player=p.x===x&&p.y===y,target=t.target.x===x&&t.target.y===y,rock=t.obstacles.some(o=>o.x===x&&o.y===y),path=t.type==='trail'&&t.path.some(o=>o.x===x&&o.y===y),visited=p.visited.some(o=>o.x===x&&o.y===y);return `<div class="route-cell ${player?'player':target?'target':rock?'rock':path||visited?'path':''}" aria-label="Fila ${y+1}, columna ${x+1}${player?', Luma':target?', meta':rock?', roca':path?', camino':''}">${player?'🦊':target?t.type==='trail'?'🏫':'💎':rock?'🪨':visited?'·':''}${target&&!player?'<small>META</small>':''}</div>`;}).join('');if(t.type==='route')$('#sequence').innerHTML=t.sequence.map((id,i)=>`<span style="display:inline-block;padding:3px 8px;margin:2px;border-radius:8px;background:${i<p.step?'#ccebd7':i===p.step?'#ffdc76':'transparent'};opacity:${i<p.step?.5:1}">${DIRS.find(d=>d.id===id).arrow} ${id}</span>`).join('');$('#routeStatus').textContent=t.type==='route'?`Pasos correctos: ${p.step} de ${t.sequence.length}`:`Movimientos: ${p.moves} · Camina por las referencias del croquis.`;}
function move(id){if(screen!=='game'||!current||current.resolved)return;const t=current.tasks[current.round];if(!['route','trail'].includes(t.type))return;const d=DIRS.find(x=>x.id===id),p=current.route,x=p.x+d.dx,y=p.y+d.dy;if(t.type==='route'&&t.sequence[p.step]!==id){error(`La próxima dirección es ${DIRS.find(d=>d.id===t.sequence[p.step]).name.toLowerCase()}. Mira la brújula y vuelve a intentarlo.`);return;}if(x<0||x>=t.size||y<0||y>=t.size){error('Ese paso sale de la cuadrícula. Prueba otra dirección.');return;}if(t.obstacles.some(o=>o.x===x&&o.y===y)){error('Hay una roca en ese lugar. Sigue el camino del croquis.');return;}if(t.type==='trail'&&!t.path.some(o=>o.x===x&&o.y===y)){error('Te alejaste del camino amarillo. Usa las referencias del croquis.');return;}p.x=x;p.y=y;p.step++;p.moves++;p.visited.push({x,y});sfx('step');paintRoute(t);if(x===t.target.x&&y===t.target.y&&(t.type==='trail'||p.step===t.sequence.length)){resolved(t);document.querySelectorAll('[data-move]').forEach(b=>b.disabled=true);$('#routeReset').disabled=true;}}
function renderMemory(t){const token=roundToken;current.memory={open:[],matched:[],busy:false};$('#taskArea').innerHTML=`<div class="memory-grid">${t.cards.map((c,i)=>`<button class="memory-card" data-card="${i}" aria-label="Tarjeta ${i+1}, boca abajo"><span aria-hidden="true">✦</span></button>`).join('')}</div><p class="route-status" id="memoryStatus">Parejas: 0 / ${t.cards.length/2}</p>`;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const mem=current.memory,i=+b.dataset.card;if(mem.busy||current.resolved||mem.open.includes(i)||mem.matched.includes(i))return;sfx('tap');mem.open.push(i);b.classList.add('face');b.textContent=t.cards[i].text;b.setAttribute('aria-label',t.cards[i].text);if(mem.open.length===2){const [a,c]=mem.open;mem.busy=true;if(t.cards[a].id===t.cards[c].id){mem.matched.push(a,c);mem.open=[];mem.busy=false;[a,c].forEach(j=>{const btn=$(`[data-card="${j}"]`);btn.classList.add('matched');btn.disabled=true;});sfx('ok');$('#memoryStatus').textContent=`Parejas: ${mem.matched.length/2} / ${t.cards.length/2}`;if(mem.matched.length===t.cards.length)resolved(t);}else{error('Esas tarjetas tienen significados distintos. Observa y recuerda dónde están.');setTimeout(()=>{if(token!==roundToken||!current)return;[a,c].forEach(j=>{const btn=$(`[data-card="${j}"]`);btn.classList.remove('face');btn.innerHTML='<span aria-hidden="true">✦</span>';btn.setAttribute('aria-label',`Tarjeta ${j+1}, boca abajo`);});mem.open=[];mem.busy=false;},1300);}}});}
function renderSort(t){current.sortIndex=0;paintSort(t);}
function paintSort(t){const item=t.items[current.sortIndex];$('#taskArea').innerHTML=`<div class="sort-count">Tarjeta ${current.sortIndex+1} de ${t.items.length}</div><div class="sort-card"><div class="big-icon" aria-hidden="true">💭</div><p>${esc(item[0])}</p></div><div class="options">${CONCEPTS.map(c=>`<button class="answer" data-sort="${c.id}"><span class="letter">${c.icon}</span><span>${c.name}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{if(current.resolved||b.disabled)return;if(b.dataset.sort===item[1]){sfx('ok');feedback(item[2],'success');current.sortIndex++;if(current.sortIndex>=t.items.length){document.querySelectorAll('[data-sort]').forEach(x=>x.disabled=true);resolved(t);}else paintSort(t);}else{b.disabled=true;b.classList.add('wrong');error('Piensa otra vez. '+t.hint);}});}
function finishLevel(){roundToken++;const ratio=current.errors/(current.tasks.length*2),stars=ratio===0&&current.hints===0?3:ratio<=1?2:1;save.stars[current.n]=Math.max(save.stars[current.n]||0,stars);persist();updateHeader();sfx('win');confetti();const n=current.n,worldEnd=n%40===0,all=completed()===200;showModal(`<div class="result"><div class="result-mascot">${mascot()}</div><div class="kicker" style="justify-content:center">${all?'Gran brújula recuperada':worldEnd?'¡Nueva insignia!':'Cristal recuperado'}</div><h2>${all?'¡Exploración legendaria!':worldEnd?'¡Isla completada!':'¡Nivel '+n+' superado!'}</h2><div class="result-stars" aria-label="${stars} de 3 estrellas">${'★'.repeat(stars)}<span style="color:#d9dece">${'★'.repeat(3-stars)}</span></div><p>${all?'Completaste los 200 niveles y aprendiste a orientarte y representar el mundo.':worldEnd?'Has completado los 40 niveles de '+WORLD[current.world].name+'. Tu siguiente isla te espera.':'Cada paso te hace mejor explorador. Sigue descubriendo nuevos caminos.'}</p><div class="result-score"><div><b>${current.tasks.length}</b><small>retos resueltos</small></div><div><b>${stars*10}</b><small>cristales del nivel</small></div><div><b>${completed()}/200</b><small>niveles completados</small></div></div><p style="font-size:12px;margin-bottom:22px">${stars===3?'¡Tres estrellas! Resolviste todo sin errores ni pistas.':'Las pistas y los intentos también enseñan. Puedes repetir para mejorar tus estrellas.'}</p><div class="result-actions"><button class="secondary" id="resultHome">Ver las islas</button><button class="secondary" id="replay">↺ Repetir</button>${n<200?'<button class="primary" id="continueNext">Nivel '+(n+1)+' →</button>':all?'<button class="primary" id="certificateBtn">Mi diploma ✦</button>':''}</div></div>`);$('#resultHome').onclick=()=>{closeModal();home();};$('#replay').onclick=()=>startLevel(n);if(n<200)$('#continueNext').onclick=()=>startLevel(n+1);if(all&&n===200)$('#certificateBtn').onclick=certificate;}
function showModal(html){const m=$('#modal');m.className='dialog-backdrop';m.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="Ventana del juego"><button class="icon-button close" id="modalClose" aria-label="Cerrar">×</button>${html}</section>`;$('#modalClose').onclick=closeModal;$('#modalClose').focus();}
function closeModal(){clearTimeout(narrationTimer);window.speechSynthesis?.cancel();$('#modal').className='hidden';$('#modal').innerHTML='';}
function guide(){sfx('tap');showModal(`<div class="kicker">Cuaderno de exploración</div><h2>¿Qué herramienta necesito?</h2><p>Cada representación tiene un propósito. Mira sus características y elige según tu misión.</p><div class="guide-grid"><div class="guide-tile"><b>🧭 Puntos cardinales</b><p>Norte (N), sur (S), este (E) y oeste (O). N–S y E–O son opuestos. En los caminos de este juego, N está arriba. En otros mapas, mira la orientación de la rosa de los vientos.</p></div><div class="guide-tile"><b>✏️ Croquis</b><p>Dibujo rápido a mano alzada. Usa referencias y puede mostrar una ruta. No necesita medidas exactas. Ejemplo: cómo llegar de casa a la escuela.</p></div><div class="guide-tile"><b>🗺️ Mapa</b><p>Representa un territorio: municipio, región, país o continente. Puede mostrar ciudades, ríos y montañas. La leyenda explica símbolos y colores; la escala relaciona distancias.</p></div><div class="guide-tile"><b>📐 Plano</b><p>Representa con detalle un espacio, como una casa o un aula, generalmente visto desde arriba. Tiene medidas, escala y símbolos. Ejemplo: la distribución de habitaciones.</p></div></div><div class="guide-tile" style="margin-top:15px"><b>↔ Escala: dibujo y realidad</b><p>Si 1 cm representa 2 m, entonces 3 cm representan 6 m: 3 × 2 = 6. En un plano de escala 1:100, 1 cm del dibujo representa 100 cm reales, es decir, 1 m.</p></div><p style="margin-top:15px;font-size:12px">También aprendimos en la presentación: un globo terráqueo representa la Tierra como una esfera. Los mapas de Lumaria son imaginarios para practicar.</p><button class="primary" id="guideClose">¡Lo tengo! →</button>`);$('#guideClose').onclick=closeModal;}
function settings(){showModal(`<div class="kicker">Prepara tu mochila</div><h2>Ajustes de exploración</h2><div class="settings-row"><span>Sonidos del juego</span><button class="switch ${save.sound?'on':''}" id="setSound">${save.sound?'Activados':'Desactivados'}</button></div><div class="settings-row"><span>Música de fondo</span><button class="switch ${save.music?'on':''}" id="setMusic">${save.music?'Activada':'Desactivada'}</button></div><div class="settings-row"><span>Lectura automática de retos</span><button class="switch ${save.voice?'on':''}" id="setVoice">${save.voice?'Activada':'Desactivada'}</button></div><p style="font-size:11px;margin-top:12px">La lectura usa las voces disponibles en tu navegador. Los efectos y la música se generan dentro del juego.</p><div class="settings-row"><span>Modo docente · acceso a 200 niveles</span><button class="switch ${save.teacher?'on':''}" id="setTeacher">${save.teacher?'Libre':'Por progreso'}</button></div><p style="font-size:11px;margin-top:12px">El modo docente permite elegir cualquier nivel para practicar en clase. Conserva tus estrellas. Sin reloj ni límite de intentos.</p><div class="settings-row"><span>Avance guardado</span><b>${completed()} / 200</b></div><button class="secondary" id="resetSave" style="font-size:12px;margin-top:18px">Borrar mi avance…</button><button class="primary" id="settingsClose" style="margin-left:8px">Listo</button>`);$('#setSound').onclick=()=>{save.sound=!save.sound;if(save.sound)ensureAudio();else{stopMusic();window.speechSynthesis?.cancel();}persist();updateHeader();settings();};$('#setMusic').onclick=()=>{save.music=!save.music;if(save.music)ensureAudio();else stopMusic();persist();settings();};$('#setVoice').onclick=()=>{save.voice=!save.voice;persist();if(!save.voice)window.speechSynthesis?.cancel();settings();};$('#setTeacher').onclick=()=>{save.teacher=!save.teacher;persist();settings();};$('#settingsClose').onclick=()=>{closeModal();if(screen==='home')home();};$('#resetSave').onclick=()=>{showModal(`<div class="kicker">Empezar otra expedición</div><h2>¿Borrar tus estrellas?</h2><p>Se borrará el avance de los ${completed()} niveles completados en este navegador. Podrás comenzar de nuevo en el nivel 1.</p><div class="result-actions" style="justify-content:flex-start;margin-top:22px"><button class="secondary" id="cancelReset">Conservar mi avance</button><button class="primary" id="confirmReset" style="margin:0">Borrar avance</button></div>`);if($('#cancelReset'))$('#cancelReset').onclick=settings;if($('#confirmReset'))$('#confirmReset').onclick=()=>{save.stars={};persist();selectedWorld=0;closeModal();home();};};}
function certificate(){showModal(`<div class="result certificate"><div class="kicker" style="justify-content:center">Geoaventura · 200 niveles completados</div><h2>Diploma de gran explorador</h2><div class="result-mascot">${mascot()}</div><p>Has aprendido a orientarte con los puntos cardinales y a diferenciar croquis, mapas y planos.</p><p style="font-size:22px;font-weight:bold;color:var(--ink);margin:25px 0;border-bottom:1px solid #c5ad64;padding:20px">Nombre: ____________________</p><p>★ ${totalStars()} estrellas · ◆ ${totalStars()*10} cristales</p><p style="margin-top:15px">¡El mundo cabe en tu cuaderno!</p></div><button class="primary" id="printDiploma">Imprimir diploma</button>`);$('#printDiploma').onclick=()=>window.print();}
$('#audioBtn').onclick=()=>{save.sound=!save.sound;if(save.sound){ensureAudio();sfx('tap');toast('Sonido activado');}else{stopMusic();clearTimeout(narrationTimer);window.speechSynthesis?.cancel();toast('Sonido silenciado');}persist();updateHeader();};$('#guideBtn').onclick=guide;$('#settingsBtn').onclick=settings;
document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('hidden')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusable=[...$('#modal').querySelectorAll('button,input,a,[tabindex="0"]')].filter(x=>!x.disabled);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}const map={ArrowUp:'N',ArrowDown:'S',ArrowLeft:'O',ArrowRight:'E'};if(screen==='game'&&current&&['route','trail'].includes(current.tasks[current.round]?.type)&&map[e.key]){e.preventDefault();move(map[e.key]);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(narrationTimer);window.speechSynthesis?.cancel();}});

function paintIcons(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode()){const node=walker.currentNode;if(['SCRIPT','STYLE'].includes(node.parentElement?.tagName))continue;EMOJI_RE.lastIndex=0;if(EMOJI_RE.test(node.nodeValue))nodes.push(node);}for(const node of nodes){const parent=node.parentElement;if(parent?.namespaceURI==='http://www.w3.org/2000/svg'){if(parent.tagName==='text'){const tok=node.nodeValue.match(EMOJI_RE)?.[0];if(!tok)continue;const el=document.createElementNS('http://www.w3.org/2000/svg','image'),size=+(parent.getAttribute('font-size')||24),x=+(parent.getAttribute('x')||0),y=+(parent.getAttribute('y')||0);el.setAttribute('href',ICON_URLS[tok]);el.setAttribute('x',x-(parent.getAttribute('text-anchor')==='middle'?size/2:0));el.setAttribute('y',y-size*.8);el.setAttribute('width',size);el.setAttribute('height',size);parent.parentNode.append(el);node.nodeValue=node.nodeValue.replace(EMOJI_RE,'');}continue;}const frag=document.createDocumentFragment();let last=0;for(const m of node.nodeValue.matchAll(EMOJI_RE)){frag.append(document.createTextNode(node.nodeValue.slice(last,m.index)));const img=document.createElement('img');img.src=ICON_URLS[m[0]];img.alt='';img.style.cssText='width:1.25em;height:1.25em;vertical-align:-.2em;display:inline-block;object-fit:contain';img.draggable=false;frag.append(img);last=m.index+m[0].length;}frag.append(document.createTextNode(node.nodeValue.slice(last)));node.replaceWith(frag);}}
new MutationObserver(()=>paintIcons(document.body)).observe(document.body,{childList:true,subtree:true});
